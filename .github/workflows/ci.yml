name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }}${{ matrix.simd && ' + SIMD' || '' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - go-version: '1.26'
            simd: false
          - go-version: '1.27'
            simd: false
          - go-version: '1.27'
            simd: true
    env:
      GOEXPERIMENT: ${{ matrix.simd && 'simd' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install reference brotli CLI
        run: sudo apt-get update && sudo apt-get install -y brotli

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go tests
        run: go test -v -count=1 ./...

  fuzz:
    name: Fuzz (Go 1.27, 60s each)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Fuzz Decode
        run: go test -run=^$ -fuzz=FuzzDecode -fuzztime=60s .

      - name: Fuzz RoundTrip
        run: go test -run=^$ -fuzz=FuzzRoundTrip -fuzztime=60s .

  lint:
    name: Lint & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run staticcheck
        run: staticcheck ./...

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify git diff check
        run: git diff --check
